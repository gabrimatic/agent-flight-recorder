name: Agent Flight Recorder
description: Analyze coding-agent code changes and fail pull requests that exceed configured risk gates.
author: Soroush Yousefpour / Gabrimatic

inputs:
  base_ref:
    description: Git ref to diff against. Defaults to origin/$GITHUB_BASE_REF on pull requests, then Agent Flight Recorder fallback refs.
    required: false
    default: ""
  manifest:
    description: Existing manifest to verify. When set, analysis is skipped and the report is rendered from this manifest.
    required: false
    default: ""
  max_score:
    description: Fail when risk score is greater than this value.
    required: false
    default: "79"
  require_tests_for_high_risk:
    description: Fail high/critical changes if no successful test command was recorded in the manifest.
    required: false
    default: "false"
  require_command_log:
    description: Fail changed manifests that have no recorded command log.
    required: false
    default: "false"
  output:
    description: Markdown report output path.
    required: false
    default: ".agent-flight/pr-report.md"

runs:
  using: composite
  steps:
    - name: Run Agent Flight analysis
      shell: bash
      run: |
        set -euo pipefail
        BASE_REF="${{ inputs.base_ref }}"
        MANIFEST_INPUT="${{ inputs.manifest }}"
        if [ -z "$BASE_REF" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          BASE_REF="origin/${GITHUB_BASE_REF}"
        fi

        AFR_BIN="$GITHUB_ACTION_PATH/afr.py"
        python "$AFR_BIN" init || true

        if [ -n "$MANIFEST_INPUT" ]; then
          if [ ! -f "$MANIFEST_INPUT" ]; then
            echo "::error::Agent Flight manifest not found: $MANIFEST_INPUT"
            exit 2
          fi
          python "$AFR_BIN" report --manifest "$MANIFEST_INPUT" --output "${{ inputs.output }}"
        else
          if [ -n "$BASE_REF" ]; then
            python "$AFR_BIN" analyze --base-ref "$BASE_REF" --output "${{ inputs.output }}"
          else
            python "$AFR_BIN" analyze --output "${{ inputs.output }}"
          fi
          MANIFEST_INPUT=".agent-flight/manifest.json"
        fi

        VERIFY_ARGS=(--manifest "$MANIFEST_INPUT" --max-score "${{ inputs.max_score }}")
        if [ "${{ inputs.require_tests_for_high_risk }}" = "true" ]; then
          VERIFY_ARGS+=(--require-tests-for-high-risk)
        fi
        if [ "${{ inputs.require_command_log }}" = "true" ]; then
          VERIFY_ARGS+=(--require-command-log)
        fi
        python "$AFR_BIN" verify "${VERIFY_ARGS[@]}"

branding:
  icon: activity
  color: blue
